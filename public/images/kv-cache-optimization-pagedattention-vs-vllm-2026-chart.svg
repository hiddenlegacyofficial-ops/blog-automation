  <rect x="380" y="228" width="423" height="26" rx="6" fill="#8b5cf6" />
  <text x="823" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">94.1% (14ms TTFT)</text>

  <!-- Row 4 -->
