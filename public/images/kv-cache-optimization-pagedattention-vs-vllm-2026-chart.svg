  <text x="834" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">96.5% (12ms TTFT)</text>

  <!-- Row 2 -->
  <text x="40" y="185" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">SGLang RadixAttention Tree</text>
