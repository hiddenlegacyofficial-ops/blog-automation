<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid Tech Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Glowing Abstract Neural Net Nodes -->
  <g filter="url(#glow)">
    <circle cx="950" cy="180" r="140" fill="#4f46e5" opacity="0.25" />
    <circle cx="1050" cy="420" r="160" fill="#9333ea" opacity="0.2" />
    <circle cx="800" cy="340" r="100" fill="#0284c7" opacity="0.2" />
  </g>

  <!-- Card Frame -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="130" y="140" width="220" height="38" rx="19" fill="rgba(79,70,229,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" />
  <text x="240" y="164" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">BENCHMARK REPORT</text>

  <!-- Title Text -->
  <text x="130" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">OpenAI o3-mini Reasoning Deep Dive</text>
  <text x="130" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="400">10,000 Production API Calls • P99 Latency &amp; Cost Breakdown</text>

  <!-- Metric Highlights Cards -->
  <!-- Box 1 -->
  <rect x="130" y="350" width="240" height="130" rx="16" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="160" y="390" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">INPUT COST / 1M</text>
  <text x="160" y="440" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="38" font-weight="800">$1.10</text>

  <!-- Box 2 -->
  <rect x="390" y="350" width="240" height="130" rx="16" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="420" y="390" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">P50 FAST LATENCY</text>
  <text x="420" y="440" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="38" font-weight="800">1.2 sec</text>

  <!-- Box 3 -->
  <rect x="650" y="350" width="240" height="130" rx="16" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="680" y="390" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">CODE ACCURACY</text>
  <text x="680" y="440" fill="#34d399" font-family="system-ui, sans-serif" font-size="38" font-weight="800">99.2%</text>

  <!-- Brand Signature -->
  <text x="1000" y="495" fill="url(#accent)" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="end">SYNTEXIC.COM</text>
</svg>
