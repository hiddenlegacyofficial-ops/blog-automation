<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <rect width="900" height="440" rx="16" fill="#0b0f19" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <text x="40" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Multi-Agent Orchestration Throughput &amp; Cost Reduction (2026)</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Higher throughput (tasks/min) &amp; lower token cost ($/10k complex tasks)</text>
  
  <!-- Row 1 -->
  <text x="40" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MCP Hybrid Swarm (Claude 3.7 + DeepSeek V3 + vLLM)</text>
  <rect x="420" y="108" width="370" height="26" rx="6" fill="#8b5cf6" />
  <text x="800" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">340 tasks/min ($4.20/10k)</text>
  
  <!-- Row 2 -->
  <text x="40" y="185" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Single Front-End Model (Claude 3.7 Extended Thinking)</text>
  <rect x="420" y="168" width="190" height="26" rx="6" fill="#f59e0b" />
  <text x="620" y="186" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">110 tasks/min ($38.50/10k)</text>

  <!-- Row 3 -->
  <text x="40" y="245" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Single Front-End Model (GPT-4.5 High Effort)</text>
  <rect x="420" y="228" width="220" height="26" rx="6" fill="#10b981" />
  <text x="650" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">145 tasks/min ($42.00/10k)</text>

  <!-- Row 4 -->
  <text x="40" y="305" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Unoptimized Multi-Agent (Pure Proprietary Mesh)</text>
  <rect x="420" y="288" width="280" height="26" rx="6" fill="#ec4899" />
  <text x="710" y="306" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">190 tasks/min ($64.10/10k)</text>

  <!-- Legend & Footer -->
  <line x1="40" y1="360" x2="860" y2="360" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="50" cy="390" r="6" fill="#8b5cf6" />
  <text x="65" y="394" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">MCP Intelligent Offloading Architecture</text>

  <circle cx="330" cy="390" r="6" fill="#f59e0b" />
  <text x="345" y="394" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Single Model Baseline</text>

  <text x="860" y="394" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Source: Syntexic Swarm Benchmark (50,000 Tasks - August 2026)</text>
</svg>
