<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <circle cx="200" cy="150" r="180" fill="#8b5cf6" opacity="0.18" filter="blur(45px)" />
  <circle cx="1000" cy="480" r="220" fill="#ec4899" opacity="0.18" filter="blur(50px)" />

  <rect x="80" y="70" width="1040" height="490" rx="24" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  
  <rect x="130" y="130" width="310" height="38" rx="19" fill="rgba(139, 92, 246, 0.2)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5" />
  <text x="285" y="154" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">AGENTIC MEMORY SYSTEMS 2026</text>
  
  <text x="130" y="235" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="800" letter-spacing="-1">Agentic Memory &amp; State Persistence 2026</text>
  <text x="130" y="285" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Hybrid Vector-Graph Memory for Autonomous AI Swarms</text>
  
  <text x="130" y="350" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">Zero Context Loss • Sub-15ms Recall • Recency-Relevance Decays • Production TypeScript</text>
  
  <line x1="130" y1="400" x2="1070" y2="400" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <text x="130" y="460" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">BY SYNTEXIC AI RESEARCH TEAM</text>
