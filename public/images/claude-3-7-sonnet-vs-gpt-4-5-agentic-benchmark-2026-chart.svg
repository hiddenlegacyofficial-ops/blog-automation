  <rect x="360" y="288" width="280" height="26" rx="6" fill="#6366f1" />
  <text x="650" y="306" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">46.8% (3.2s P99)</text>

  <!-- Legend & Footer -->
