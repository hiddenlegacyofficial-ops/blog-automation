  <rect x="360" y="228" width="310" height="26" rx="6" fill="#38bdf8" />
  <text x="680" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">51.9% (2.1s P99)</text>

  <!-- Row 4 -->
