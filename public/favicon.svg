<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" filter="url(#shadow)" />

  <!-- Inner Tech Emblem (Syntexic 'S' Code Prompt) -->
  <g fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Prompt Arrow '>' -->
    <path d="M 160 160 L 272 248 L 160 336" />
    <!-- Cursor Underscore '_' -->
    <path d="M 310 336 L 368 336" />
    <!-- Active AI Pulse Dot -->
    <circle cx="352" cy="176" r="22" fill="#38bdf8" stroke="none" />
  </g>
</svg>
